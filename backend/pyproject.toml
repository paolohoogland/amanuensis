[project]
name = "amanuensis"
version = "0.1.0"
description = "Music splitter and tab transcriber."
authors = [
    { name = "phoogland", email = "paolo.hoogland@etu.unistra.fr" }
]
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not slow'"
markers = ["slow: loads ML models or hits the network"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["amanuensis"]
